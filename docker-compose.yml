services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeroflash-api
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: aeroflash
      DB_USERNAME: aeroflash
      DB_PASSWORD: aeroflash_secret
    networks:
      - aeroflash

  mysql:
    image: mysql:8.0
    container_name: aeroflash-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: aeroflash
      MYSQL_USER: aeroflash
      MYSQL_PASSWORD: aeroflash_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeroflash

volumes:
  mysql_data:

networks:
  aeroflash:
